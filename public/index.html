<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Replay 3D</title>
<meta name="description" content="Watch F1 sessions replayed as 3D cars on a 3D track you can fly around, using free OpenF1 data.">
<meta name="theme-color" content="#101214">
<link rel="stylesheet" href="style.css">
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
</head>
<body>
<canvas id="view" aria-label="3D track view. Drag to turn, scroll or pinch to zoom, right-drag or two fingers to move."></canvas>

<header id="top">
  <div class="brand">Replay<span>3D</span></div>
  <form id="picker" autocomplete="off">
    <label>Year <select id="year"></select></label>
    <label class="check"><input type="checkbox" id="onlySilverstone"> Silverstone only</label>
    <label class="grow">Session <select id="session"><option>Loading…</option></select></label>
    <label>From lap <input id="lap" type="number" min="1" value="1"></label>
    <label>Length <select id="mins"><option value="1">1 min</option><option value="2">2 min</option><option value="3" selected>3 min</option><option value="5">5 min</option><option value="10">10 min</option></select></label>
    <button type="submit" id="load" class="primary">Load replay</button>
    <button type="button" id="latest">Latest session</button>
    <button type="button" id="demo">Silverstone demo</button>
  </form>
</header>

<div id="status" role="status"></div>

<aside id="drivers" aria-label="Drivers">
  <h2>Drivers <button type="button" id="hideDrivers" aria-label="Hide drivers">–</button></h2>
  <ol id="driverList"></ol>
</aside>

<footer id="bar">
  <button type="button" id="play" class="primary" aria-label="Play or pause">Play</button>
  <input id="scrub" type="range" min="0" max="1000" value="0" step="1" aria-label="Replay position">
  <span id="clock">0:00 / 0:00</span>
  <label>Speed <select id="speed"><option>0.5</option><option selected>1</option><option>2</option><option>5</option><option>10</option><option>20</option></select></label>
  <label>Camera <select id="cam"><option value="free">Free</option><option value="follow">Follow car</option></select></label>
  <label>Car size <input id="size" type="range" min="1" max="8" step="0.5" value="3"></label>
  <button type="button" id="reset">Reset view</button>
  <span id="hud"></span>
</footer>
<p id="credit">Unofficial fan project. Data from <a href="https://openf1.org" target="_blank" rel="noopener">OpenF1</a>. Silverstone demo outline is approximate.</p>

<script type="module" src="app.js"></script>
</body>
</html>
